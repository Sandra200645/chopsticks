<!DOCTYPE html>
<html>
<head>
    <title>Chopsticks Hand Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <h1>CHOPSTICKS HAND GAME</h1>
    <button id="start">START GAME</button>
    <p id="message">Press START GAME to begin</p>

    <div class="players">

        <div class="player">
            <h2>PLAYER 1</h2>
            <img id="p1l" src="1.png">
            <img id="p1r" src="1.png">
        </div>

        <div class="player">
            <h2>PLAYER 2</h2>
            <img id="p2l" src="1.png">
            <img id="p2r" src="1.png">
        </div>

    </div>

    <button id="split">SPLIT</button>
    <p id="result"></p>
</div>

<script src="script.js"></script>
</body>
</html>
